<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app">
    <!-- Pixel header -->
    <header class="header">
      <span class="header-decor" aria-hidden="true">◆</span>
      <button
        id="themePicker"
        class="brand-dot"
        type="button"
        aria-label="Change UI theme color"
        title="Change UI theme color"
      ></button>
      <h1 class="brand" data-i18n="brand">TinyPalette</h1>
      <button
        id="langToggle"
        class="header-decor lang-toggle"
        type="button"
        aria-label="Switch language"
      >◆</button>
    </header>

    <!-- Input row: # + HEX + circular picker + preview dot -->
    <section class="input-row">
      <div class="hash" id="hashSign">#</div>
      <input
        id="hexInput"
        class="hex-input"
        type="text"
        spellcheck="false"
        autocomplete="off"
        maxlength="6"
        placeholder="ENTER HEX"
        aria-label="HEX color code"
      />
      <button
        id="colorPicker"
        class="color-picker"
        type="button"
        aria-label="Pick a color"
        title="Pick a color"
      ></button>
      <button class="copy-btn" data-copy="hex" aria-label="Copy HEX">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
    </section>

    <!-- Info rows -->
    <section class="info-list">
      <div class="info-row">
        <span class="info-label" data-i18n="hex">HEX</span>
        <span class="info-value" id="hexValue">--</span>
        <button class="copy-btn" data-copy="hex" aria-label="Copy HEX">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
      </div>

      <div class="info-row">
        <span class="info-label" data-i18n="rgb">RGB</span>
        <span class="info-value" id="rgbValue">--</span>
        <button class="copy-btn" data-copy="rgb" aria-label="Copy RGB">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
      </div>

      <div class="info-row">
        <span class="info-label" data-i18n="hsl">HSL</span>
        <span class="info-value" id="hslValue">--</span>
        <button class="copy-btn" data-copy="hsl" aria-label="Copy HSL">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
      </div>
    </section>

    <!-- Copy CSS -->
    <button id="copyCssBtn" class="css-btn">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="9" y="2" width="6" height="4" rx="1"/></svg>
      <span data-i18n="copyCss">Copy CSS</span>
    </button>

  </main>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Custom pixel color picker panel -->
  <div id="pickerPanel" class="picker-panel" hidden>
    <canvas id="svCanvas" class="sv-canvas" width="160" height="100"></canvas>
    <canvas id="hueCanvas" class="hue-canvas" width="160" height="12"></canvas>
    <div class="picker-footer">
      <span id="pickerPreview" class="picker-preview"></span>
      <input
        id="pickerHex"
        class="picker-hex"
        type="text"
        spellcheck="false"
        autocomplete="off"
        maxlength="6"
        aria-label="HEX color code"
      />
      <button id="pickerOk" class="picker-ok" type="button" data-i18n="ok">OK</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
